name: Build Kylin V10 arm64 deb

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "configure = 只验依赖；jsc = 配置 + 编 JavaScriptCore（快验编译问题）；full = 完整编译打包"
        type: choice
        options: [full, configure, jsc]
        default: full
      sfm_ref:
        description: "上游 tag / 分支"
        default: v2.2.0
  push:
    tags: ["v*"]

jobs:
  webkit:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:10
      options: --user root
    timeout-minutes: 355
    steps:
      - name: 基础环境
        run: |
          set -eux
          printf 'deb http://archive.debian.org/debian buster main contrib non-free\ndeb http://archive.debian.org/debian-security buster/updates main contrib non-free\n' > /etc/apt/sources.list
          rm -rf /etc/apt/sources.list.d/*
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates curl
          git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" /work
          bash /work/scripts/10-setup-debian10.sh

      - name: glib 2.72
        run: bash /work/scripts/15-build-glib.sh

      - name: libsoup 3
        run: bash /work/scripts/20-build-libsoup3.sh

      - name: WebKitGTK 4.1 配置校验
        if: inputs.stage == 'configure' || inputs.stage == 'jsc'
        run: bash /work/scripts/35-webkit-configure.sh

      - name: JavaScriptCore 快验编译
        if: inputs.stage == 'jsc'
        run: bash /work/scripts/36-jsc-probe.sh

      - name: WebKitGTK 4.1 编译安装
        if: inputs.stage == '' || inputs.stage == 'full'
        run: bash /work/scripts/30-build-webkit.sh

      - name: 打包 sysroot
        if: inputs.stage == '' || inputs.stage == 'full'
        run: |
          set -eux
          cd /usr/local
          tar -cJf /webkit-prefix.tar.xz .
          ls -lh /webkit-prefix.tar.xz

      - uses: actions/upload-artifact@v4
        if: inputs.stage == '' || inputs.stage == 'full'
        with:
          name: webkit-prefix
          path: /webkit-prefix.tar.xz
          retention-days: 3
          compression-level: 0

  app:
    needs: webkit
    if: needs.webkit.result == 'success' && (inputs.stage == '' || inputs.stage == 'full')
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:10
      options: --user root
    timeout-minutes: 180
    steps:
      - name: 基础环境
        run: |
          set -eux
          printf 'deb http://archive.debian.org/debian buster main contrib non-free\ndeb http://archive.debian.org/debian-security buster/updates main contrib non-free\n' > /etc/apt/sources.list
          rm -rf /etc/apt/sources.list.d/*
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils
          git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" /work
          bash /work/scripts/10-setup-debian10.sh

      - uses: actions/download-artifact@v4
        with:
          name: webkit-prefix
          path: /tmp

      - name: 还原 WebKit sysroot
        run: |
          set -eux
          tar -xJf /tmp/webkit-prefix.tar.xz -C /usr/local
          ldconfig || true
          pkg-config --modversion webkit2gtk-4.1

      - name: 编译应用
        env:
          SFM_REF: ${{ inputs.sfm_ref || 'v2.2.0' }}
          PATCH_WRY_238: "1"
        run: bash /work/scripts/40-build-app.sh

      - name: 组装 deb
        run: bash /work/scripts/50-package-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: /out/dist/*.deb
          retention-days: 7
